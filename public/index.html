<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex</title>
  <link rel="stylesheet" href="pokedex.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: rgb(89, 24, 24);
      font-family: sans-serif;
    }

    #pokemon-list {
      position: absolute;
      top: 50px;
      left: 750px; 
      width: 200px;
      max-height: 400px;
      overflow-y: auto;
      background-color: #00cc00;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px #000;
      list-style: none;
    }

    #pokemon-list li {
      margin-bottom: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #pokemon-list li:hover {
      color: #fff;
      background-color: #008800;
      padding: 2px 6px;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <div id="pokedex">
    <div id="left">
      <div id="logo"></div>
      <div id="bg_curve1_left"></div>
      <div id="bg_curve2_left"></div>
      <div id="curve1_left">
        <div id="buttonGlass">
          <div id="reflect"></div>
        </div>
        <div id="miniButtonGlass1"></div>
        <div id="miniButtonGlass2"></div>
        <div id="miniButtonGlass3"></div>
      </div>
      <div id="curve2_left">
        <div id="junction">
          <div id="junction1"></div>
          <div id="junction2"></div>
        </div>
      </div>

      <div id="screen">
        <div id="picture">
          <img id="pokemonImage" title="Click e altere imagem" height="170" />
        </div>

        <div id="buttonbottomPicture"></div>
        <div id="speakers">
          <div class="sp"></div>
          <div class="sp"></div>
          <div class="sp"></div>
          <div class="sp"></div>
        </div>
      </div>

      <div id="bigbluebutton"></div>
      <div id="barbutton1"></div>
      <div id="barbutton2"></div>
      <div id="cross">
        <div id="leftcross">
          <div id="leftT"></div>
        </div>
        <div id="topcross">
          <div id="upT"></div>
        </div>
        <div id="rightcross">
          <div id="rightT"></div>
        </div>
        <div id="midcross">
          <div id="midCircle"></div>
        </div>
        <div id="botcross">
          <div id="downT"></div>
        </div>
      </div>
    </div>

    <div id="right">
      <div id="stats">
        <strong>Nome:</strong> <span id="nome">---</span><br />
        <strong>Habilidades:</strong> <span id="habilidades">---</span><br />
        <strong>Evolução:</strong> <span id="evolucao">---</span><br />
      </div>
    </div>
  </div>

  <ul id="pokemon-list"></ul>

  <script>
    fetch('/pokemons')
      .then(res => res.json())
      .then(pokemons => {
        const list = document.getElementById('pokemon-list');
        pokemons.forEach(pokemon => {
          const item = document.createElement('li');
          item.textContent = pokemon.nome;
          item.addEventListener('click', () => {
            document.getElementById('nome').textContent = pokemon.nome;
            document.getElementById('habilidades').textContent = pokemon.habilidades.join(', ');
            document.getElementById('evolucao').textContent = pokemon.evolucao;
            document.getElementById('pokemonImage').src = pokemon.imagem || '';
          });
          list.appendChild(item);
        });
      });
  </script>
</body>

</html>
